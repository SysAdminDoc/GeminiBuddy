<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="sidepanelTitle">GeminiBuddy Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="side-panel" aria-labelledby="side-panel-title">
    <header class="panel-header">
      <div>
        <p class="eyebrow" data-i18n="extensionName">GeminiBuddy</p>
        <h1 id="side-panel-title" data-i18n="sidepanelTitle">Prompt library</h1>
      </div>
      <button id="refresh-button" type="button" title="Reload prompts">↻</button>
    </header>

    <label class="field-label" for="profile-select" data-i18n="profile">Profile</label>
    <select id="profile-select"></select>

    <label class="field-label" for="search-input" data-i18n="search">Search</label>
    <input id="search-input" type="search" placeholder="Search prompts…" data-i18n-placeholder="searchPlaceholder" autocomplete="off">

    <section class="editor" aria-labelledby="editor-title">
      <div class="section-heading">
        <h2 id="editor-title" data-i18n="promptEditor">Prompt editor</h2>
        <button id="cancel-edit" type="button" hidden data-i18n="cancel">Cancel</button>
      </div>
      <label class="field-label" for="prompt-name" data-i18n="name">Name</label>
      <input id="prompt-name" type="text" placeholder="Prompt name" data-i18n-placeholder="promptNamePlaceholder">
      <label class="field-label" for="prompt-category" data-i18n="group">Group</label>
      <input id="prompt-category" type="text" placeholder="Group name" data-i18n-placeholder="groupNamePlaceholder" value="Side Panel">
      <label class="field-label" for="prompt-text" data-i18n="text">Text</label>
      <textarea id="prompt-text" rows="4" placeholder="Prompt text" data-i18n-placeholder="promptTextPlaceholder"></textarea>
      <button id="save-prompt" class="primary" type="button" data-i18n="addPrompt">Add prompt</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="prompt-list" class="prompt-list" aria-live="polite"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
